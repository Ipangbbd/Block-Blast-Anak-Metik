<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Blast Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-blue-300 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-md w-full">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-blue-800 mb-2">Block Blast anak metik</h1>
            <div class="flex justify-center gap-8">
                <div class="text-xl font-semibold text-gray-700">
                    Score: <span id="score" class="inline-block">0</span>
                </div>
                <div class="text-xl font-semibold text-gray-700">
                    Level: <span id="level" class="inline-block">1</span>
                </div>
            </div>
            <div id="combo-message" class="combo-message absolute hidden text-2xl font-bold text-green-600"></div>
        </div>

        <div class="bg-blue-400 rounded-lg shadow-lg p-4 mb-6 relative">
            <div id="game-grid" class="grid grid-cols-10 gap-0 border border-gray-200 mb-4"></div>

            <div class="flex justify-between items-center mb-2">
                <div id="next-blocks" class="flex gap-4"></div>
                <button id="hint-btn"
                    class="px-3 py-1 bg-gray-200 hover:bg-gray-300 text-gray-800 rounded-lg text-sm font-medium transition">
                    Hint
                </button>
            </div>

            <div id="drag-ghost" class="hidden absolute z-20 block-preview"></div>
        </div>

        <div id="game-over" class="hidden fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-30">
            <div class="bg-white rounded-xl p-8 text-center game-over max-w-sm w-full">
                <h2 class="text-2xl font-bold text-gray-800 mb-2">Game Over!</h2>
                <p class="text-gray-600 mb-4">Your final score: <span id="final-score" class="font-bold">0</span></p>
                <p class="text-gray-600 mb-4">Level reached: <span id="final-level" class="font-bold">1</span></p>
                <button id="new-game-btn"
                    class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold transition">
                    New Game
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
